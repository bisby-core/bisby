openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: routing
    description: Tenant route authorization operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a tenant-local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated tenant-local account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedLocalUser"
        "400":
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current tenant-local account
      responses:
        "200":
          description: Current authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedLocalUser"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Replace a tenant-local account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password replaced and first-login requirement cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid password-change payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication or the current password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current tenant-local session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /access/{moduleKey}/{workspaceKey}:
    get:
      operationId: getRouteAccess
      tags: [routing]
      summary: Check access to a tenant workspace route
      description: Returns access only when the authenticated local account is assigned to the requested module and workspace.
      parameters:
        - name: moduleKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ModuleKey"
        - name: workspaceKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceKey"
      responses:
        "200":
          description: The authenticated account is assigned to the route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteAccess"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated account is not assigned to the route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "428":
          description: A permanent password must be set before workspace access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The route target does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - username
        - password
    AuthenticatedLocalUser:
      type: object
      properties:
        accountId:
          type: string
        tenantId:
          type: string
        role:
          type: string
          enum:
            - staff
            - client
        requiresPasswordChange:
          type: boolean
      required:
        - accountId
        - tenantId
        - role
        - requiresPasswordChange
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 255
        newPassword:
          type: string
          minLength: 12
          maxLength: 255
      required:
        - currentPassword
        - newPassword
    PasswordChangeResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - password_changed
        requiresPasswordChange:
          type: boolean
          enum:
            - false
      required:
        - status
        - requiresPasswordChange
    AuthLogoutResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ModuleKey:
      type: string
      enum:
        - module_a
        - module_b
        - module_c
        - module_d
        - module_e
        - module_f
        - module_g
        - module_h
    WorkspaceKey:
      type: string
      pattern: "^ws-(?:[1-9]|10)$"
    RouteAccess:
      type: object
      properties:
        allowed:
          type: boolean
        tenantId:
          type: string
        subdomain:
          type: string
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        workspaceKey:
          $ref: "#/components/schemas/WorkspaceKey"
      required:
        - allowed
        - tenantId
        - subdomain
        - moduleKey
        - workspaceKey
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

