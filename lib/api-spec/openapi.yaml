openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: routing
    description: Customer-space route authorization operations
  - name: administration
    description: Customer-space role and account administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a customer-space account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated customer-space account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedLocalUser"
        "400":
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current customer-space account
      responses:
        "200":
          description: Current authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedLocalUser"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Replace a customer-space account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password replaced and first-login requirement cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid password-change payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication or the current password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current customer-space session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /customer-context:
    get:
      operationId: getCustomerContext
      tags: [routing]
      summary: Get the resolved customer-space identity
      responses:
        "200":
          description: Customer name and subdomain for this customer host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContext"
  /access/{moduleKey}/{workspaceKey}:
    get:
      operationId: getRouteAccess
      tags: [routing]
      summary: Check access to a customer workspace route
      description: Returns access only when the authenticated local account is assigned to the requested module and workspace.
      parameters:
        - name: moduleKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ModuleKey"
        - name: workspaceKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceKey"
      responses:
        "200":
          description: The authenticated account is assigned to the route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteAccess"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated account is not assigned to the route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "428":
          description: A permanent password must be set before workspace access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The route target does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /access/{moduleKey}/{workspaceKey}/content/{nodeType}/{nodeKey}:
    get:
      operationId: getContentAccess
      tags: [routing]
      summary: Resolve effective access to a page, tab, or card
      parameters:
        - name: moduleKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ModuleKey"
        - name: workspaceKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceKey"
        - name: nodeType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceContentNodeType"
        - name: nodeKey
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,126})$"
      responses:
        "200":
          description: Effective content access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentAccess"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The workspace or content is not available to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The workspace or content target does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/workspaces:
    get:
      operationId: getModuleWorkspaceControl
      tags: [administration]
      summary: List a selected module's workspaces and content controls
      description: A tenant admin must explicitly select an enabled module. A module admin may only read their assigned enabled module.
      parameters:
        - name: moduleKey
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModuleKey"
      responses:
        "200":
          description: Module workspace control snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceControlSnapshot"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The selected module is not available to this administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createModuleWorkspace
      tags: [administration]
      summary: Add a workspace to the current module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleWorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedModuleWorkspace"
  /admin/workspaces/hierarchy:
    post:
      operationId: addModuleWorkspaceHierarchyNode
      tags: [administration]
      summary: Add a semantic page, tab, or card across every workspace in the assigned module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceHierarchyNodeInput"
      responses:
        "201":
          description: Hierarchy node added to every module workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceControlSnapshot"
        "400":
          description: Invalid hierarchy node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The assigned active module admin role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The semantic parent is missing from a workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The semantic key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/workspaces/hierarchy/{nodeType}/{nodeKey}:
    parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/WorkspaceContentNodeType"
      - name: nodeKey
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/WorkspaceContentNodeKey"
    patch:
      operationId: updateModuleWorkspaceHierarchyNode
      tags: [administration]
      summary: Edit a semantic page, tab, or card across every workspace in the assigned module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceHierarchyNodeUpdate"
      responses:
        "200":
          description: Hierarchy node updated in every module workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceControlSnapshot"
        "400":
          description: Invalid hierarchy node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The assigned active module admin role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The semantic node or parent is missing from a workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The semantic key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeModuleWorkspaceHierarchyNode
      tags: [administration]
      summary: Remove a semantic node and descendants across every workspace in the assigned module
      responses:
        "200":
          description: Hierarchy node and descendants removed from every module workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceControlSnapshot"
        "403":
          description: The assigned active module admin role is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The semantic node is missing from a workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/tenant-workspaces:
    get:
      operationId: getTenantWorkspaces
      tags: [administration]
      responses:
        "200":
          description: Tenant-wide workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" }
    post:
      operationId: createTenantWorkspace
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMetadataRequest" }
      responses:
        "201":
          description: Tenant workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" }
  /admin/tenant-workspaces/{workspaceKey}:
    patch:
      operationId: updateTenantWorkspace
      tags: [administration]
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TenantWorkspaceKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMetadataRequest" }
      responses:
        "200":
          description: Tenant workspace updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" }
    delete:
      operationId: removeTenantWorkspace
      tags: [administration]
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TenantWorkspaceKey" }
      responses:
        "200":
          description: Tenant workspace removed
  /admin/tenant-workspaces/{workspaceKey}/access:
    put:
      operationId: updateTenantWorkspaceAccess
      tags: [administration]
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TenantWorkspaceKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceAccessRequest" }
      responses:
        "200":
          description: Tenant workspace access controls updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" }
  /admin/workspaces/{workspaceKey}/metadata:
    patch:
      operationId: updateModuleWorkspaceMetadata
      tags: [administration]
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema: { $ref: "#/components/schemas/WorkspaceKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMetadataRequest" }
      responses:
        "200":
          description: Module workspace updated
  /public/workspaces:
    get:
      operationId: getPublicTenantWorkspaces
      tags: [routing]
      responses:
        "200":
          description: Active public tenant and module workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicWorkspaceList" }
        "400":
          description: Invalid workspace data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active module admin is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/workspaces/{workspaceKey}:
    delete:
      operationId: removeModuleWorkspace
      tags: [administration]
      summary: Remove a workspace and its Staff and Client assignments
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceKey"
      responses:
        "200":
          description: Workspace removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleWorkspaceRemovedResponse"
        "403":
          description: An active module admin is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/workspaces/{workspaceKey}/access:
    put:
      operationId: updateModuleWorkspaceAccess
      tags: [administration]
      summary: Replace page, tab, and card access levels for a workspace
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleWorkspaceAccessRequest"
      responses:
        "200":
          description: Workspace access controls updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedModuleWorkspace"
        "400":
          description: Invalid access controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active module admin is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Workspace or content control not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users:
    get:
      operationId: getTenantAdmin
      tags: [administration]
      summary: Get the current tenant administration scope and managed accounts
      responses:
        "200":
          description: Tenant-local administration snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAdminSnapshot"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account has no administration scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "428":
          description: A permanent password must be set first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createManagedTenantAccount
      tags: [administration]
      summary: Create a module admin, module staff, or client account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTenantAccountCreateRequest"
      responses:
        "201":
          description: Managed account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTenantAccount"
        "400":
          description: Invalid role or assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account cannot manage the requested role or module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The username is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{accountId}:
    patch:
      operationId: updateManagedTenantAccountStatus
      tags: [administration]
      summary: Activate or deactivate a managed tenant account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTenantAccountStatusRequest"
      responses:
        "200":
          description: Managed account status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTenantAccountStatusResponse"
        "403":
          description: The account cannot manage the target account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The managed account does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteManagedTenantAccount
      tags: [administration]
      summary: Permanently delete a module staff or client account and its assignments
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Managed account and assignments deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccountDeletionResponse"
        "403":
          description: The exact module admin is required
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: The managed account does not exist
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /admin/users/{accountId}/access:
    patch:
      operationId: updateManagedTenantAccountAccess
      tags: [administration]
      summary: Change a staff or client role and workspace access
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTenantAccountAccessRequest"
      responses:
        "200":
          description: Managed account access updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTenantAccount"
        "400":
          description: Invalid role or workspace assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account cannot manage the target account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The managed account does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/users/{accountId}/reset-password:
    post:
      operationId: resetManagedTenantAccountPassword
      tags: [administration]
      summary: Set a temporary password on an active managed tenant account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTenantAccountPasswordResetRequest"
      responses:
        "200":
          description: Temporary password set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTenantAccountPasswordResetResponse"
        "403":
          description: The account cannot manage the target account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The active managed account does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/tenant-admin-staff:
    get:
      operationId: getTenantAdminStaffAdministration
      tags: [administration]
      summary: List tenant admin staff and Tenant Admin Staff Workspaces
      responses:
        "200":
          description: Tenant admin staff administration snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffAdministrationSnapshot" } } }
        "403": { description: A tenant admin is required }
    post:
      operationId: createTenantAdminStaff
      tags: [administration]
      summary: Create a tenant admin staff account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAdminStaffCreateRequest"
      responses:
        "201":
          description: Tenant admin staff account created
          content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffAccount" } } }
  /admin/tenant-admin-staff-workspaces:
    post:
      operationId: createTenantAdminStaffWorkspace
      tags: [administration]
      summary: Create a Tenant Admin Staff Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAdminStaffWorkspaceCreateRequest"
      responses:
        "201":
          description: Internal workspace created
          content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspace" } } }
  /admin/tenant-admin-staff-workspaces/hierarchy:
    post:
      operationId: addTenantAdminStaffWorkspaceHierarchyNode
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceHierarchyNodeInput" } } }
      responses:
        "201": { description: Hierarchy node added to every Design Admin Staff Workspace, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceList" } } } }
  /admin/tenant-admin-staff-workspaces/hierarchy/{nodeType}/{nodeKey}:
    parameters:
      - { name: nodeType, in: path, required: true, schema: { $ref: "#/components/schemas/WorkspaceContentNodeType" } }
      - { name: nodeKey, in: path, required: true, schema: { $ref: "#/components/schemas/WorkspaceContentNodeKey" } }
    patch:
      operationId: updateTenantAdminStaffWorkspaceHierarchyNode
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceHierarchyNodeUpdate" } } }
      responses:
        "200": { description: Hierarchy node updated in every Design Admin Staff Workspace, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceList" } } } }
    delete:
      operationId: removeTenantAdminStaffWorkspaceHierarchyNode
      tags: [administration]
      responses:
        "200": { description: Hierarchy node removed from every Design Admin Staff Workspace, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceList" } } } }
  /admin/tenant-admin-staff/{accountId}:
    patch:
      operationId: updateTenantAdminStaffStatus
      tags: [administration]
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffStatusRequest" } } }
      responses: { "200": { description: Tenant admin staff status updated, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffStatusResponse" } } } } }
    delete:
      operationId: deleteTenantAdminStaff
      tags: [administration]
      summary: Permanently delete a tenant admin staff account and its assignments
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Tenant admin staff account and assignments deleted, content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccountDeletionResponse" } } } }
        "403": { description: A tenant admin is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Tenant admin staff account not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /admin/tenant-admin-staff/{accountId}/assignments:
    put:
      operationId: updateTenantAdminStaffAssignments
      tags: [administration]
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffAssignmentsRequest" } } }
      responses: { "200": { description: Tenant admin staff assignments updated, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffAssignmentsResponse" } } } } }
  /admin/tenant-admin-staff/{accountId}/reset-password:
    post:
      operationId: resetTenantAdminStaffPassword
      tags: [administration]
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffPasswordResetRequest" } } }
      responses: { "200": { description: Tenant admin staff password reset, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffPasswordResetResponse" } } } } }
  /admin/tenant-admin-staff-workspaces/{workspaceKey}:
    patch:
      operationId: updateTenantAdminStaffWorkspace
      tags: [administration]
      parameters: [{ name: workspaceKey, in: path, required: true, schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceUpdateRequest" } } }
      responses: { "200": { description: Tenant Admin Staff Workspace updated, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspace" } } } } }
    delete:
      operationId: removeTenantAdminStaffWorkspace
      tags: [administration]
      parameters: [{ name: workspaceKey, in: path, required: true, schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" } }]
      responses: { "200": { description: Tenant Admin Staff Workspace deleted, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceRemovalResponse" } } } } }
  /admin/tenant-admin-staff-workspaces/{workspaceKey}/access:
    put:
      operationId: updateTenantAdminStaffWorkspaceAccess
      tags: [administration]
      parameters: [{ name: workspaceKey, in: path, required: true, schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceAccessRequest" } } }
      responses:
        "200": { description: Design Admin Staff Workspace access updated, content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspace" } } } }
  /platform-staff/login:
    post:
      operationId: loginPlatformStaff
      tags: [administration]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: Authenticated platform staff account, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffSession" } } } }
        "400": { description: Invalid credentials payload, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Invalid platform staff credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /platform-staff/logout:
    post:
      operationId: logoutPlatformStaff
      tags: [administration]
      responses:
        "200": { description: Platform staff session ended, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffLogoutResponse" } } } }
  /platform-staff/me:
    get:
      operationId: getCurrentPlatformStaff
      tags: [administration]
      responses:
        "200": { description: Current platform staff account, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffSession" } } } }
        "401": { description: Platform staff authentication is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /platform-staff/change-password:
    post:
      operationId: changePlatformStaffPassword
      tags: [administration]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "200": { description: Password changed, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffPasswordChangeResponse" } } } }
        "400": { description: Invalid password change payload, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Authentication or current password is invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /platform-staff/workspaces:
    get:
      operationId: getPlatformStaffWorkspaces
      tags: [administration]
      responses:
        "200": { description: Assigned active platform workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" } } } }
        "401": { description: Platform staff authentication is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: A password change is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /platform-staff/workspaces/{workspaceKey}:
    get:
      operationId: getPlatformStaffWorkspace
      tags: [administration]
      parameters: [{ name: workspaceKey, in: path, required: true, schema: { $ref: "#/components/schemas/PlatformWorkspaceKey" } }]
      responses:
        "200": { description: Assigned platform workspace, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" } } } }
        "401": { description: Platform staff authentication is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: A password change is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Workspace is not assigned or does not exist, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/platform-staff:
    get:
      operationId: getPlatformStaffAdministration
      tags: [administration]
      responses:
        "200": { description: Platform staff and assignable workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffSnapshot" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: createPlatformStaff
      tags: [administration]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffCreateRequest" } } } }
      responses:
        "201": { description: Platform staff created, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffCreateResponse" } } } }
        "400": { description: Invalid staff or workspace assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Platform staff username already exists, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/platform-staff/{platformStaffId}:
    delete:
      operationId: deletePlatformStaff
      tags: [administration]
      parameters: [{ name: platformStaffId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Platform staff deleted, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffDeletionResponse" } } } }
        "400": { description: Invalid platform staff identifier, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Platform staff not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/platform-staff/{platformStaffId}/workspaces:
    put:
      operationId: updatePlatformStaffWorkspaces
      tags: [administration]
      parameters: [{ name: platformStaffId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffWorkspacesRequest" } } } }
      responses:
        "200": { description: Platform staff workspace assignments updated, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffWorkspacesResponse" } } } }
        "400": { description: Invalid staff identifier or workspace assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Platform staff not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/platform-staff/{platformStaffId}/status:
    patch:
      operationId: updatePlatformStaffStatus
      tags: [administration]
      parameters: [{ name: platformStaffId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ActiveStatusRequest" } } } }
      responses:
        "200": { description: Platform staff status updated, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffStatusResponse" } } } }
        "400": { description: Invalid staff status or workspace assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Platform staff not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/platform-staff/{platformStaffId}/reset-password:
    post:
      operationId: resetPlatformStaffPassword
      tags: [administration]
      parameters: [{ name: platformStaffId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffPasswordResetRequest" } } } }
      responses:
        "200": { description: Platform staff temporary password reset, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformStaffPasswordResetResponse" } } } }
        "400": { description: Invalid staff identifier or temporary password, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Platform staff not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/workspaces:
    get:
      operationId: getPlatformWorkspaces
      tags: [administration]
      responses:
        "200": { description: Platform Admin Staff Workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" } } } }
    post:
      operationId: createPlatformWorkspace
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceMetadataRequest" } } }
      responses:
        "201": { description: Platform Admin Staff Workspace created, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" } } } }
  /owner/workspaces/hierarchy:
    post:
      operationId: addPlatformWorkspaceHierarchyNode
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceHierarchyNodeInput" } } }
      responses:
        "201": { description: Hierarchy added across all Platform Admin Staff Workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" } } } }
        "400": { description: Invalid hierarchy payload or parent relationship, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: A required workspace parent is missing, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: The semantic hierarchy key already exists, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/workspaces/hierarchy/{nodeType}/{nodeKey}:
    parameters:
      - { name: nodeType, in: path, required: true, schema: { $ref: "#/components/schemas/WorkspaceContentNodeType" } }
      - { name: nodeKey, in: path, required: true, schema: { $ref: "#/components/schemas/WorkspaceContentNodeKey" } }
    patch:
      operationId: updatePlatformWorkspaceHierarchyNode
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceHierarchyNodeUpdate" } } }
      responses:
        "200": { description: Hierarchy updated across all Platform Admin Staff Workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" } } } }
        "400": { description: Invalid hierarchy payload or parent relationship, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: The semantic node or parent is missing, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: The replacement semantic key already exists, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: removePlatformWorkspaceHierarchyNode
      tags: [administration]
      responses:
        "200": { description: Hierarchy removed across all Platform Admin Staff Workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspaceList" } } } }
        "400": { description: Invalid hierarchy target, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Platform Administrator session is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: The semantic node is missing, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /owner/workspaces/{workspaceKey}:
    parameters:
      - { name: workspaceKey, in: path, required: true, schema: { type: string, pattern: "^pws-[1-9][0-9]*$" } }
    patch:
      operationId: updatePlatformWorkspace
      tags: [administration]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceMetadataRequest" } } }
      responses:
        "200": { description: Platform Admin Staff Workspace updated, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" } } } }
    delete:
      operationId: removePlatformWorkspace
      tags: [administration]
      responses:
        "200": { description: Platform Admin Staff Workspace removed, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleWorkspaceRemovedResponse" } } } }
  /owner/workspaces/{workspaceKey}/access:
    put:
      operationId: updatePlatformWorkspaceAccess
      tags: [administration]
      parameters: [{ name: workspaceKey, in: path, required: true, schema: { type: string, pattern: "^pws-[1-9][0-9]*$" } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceAccessRequest" } } }
      responses:
        "200": { description: Platform Admin Staff Workspace access updated, content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRegistryWorkspace" } } } }
  /tenant-admin-staff/{workspaceKey}/access:
    get:
      operationId: getTenantAdminStaffWorkspaceAccess
      tags: [routing]
      summary: Authorize a tenant admin staff workspace destination
      parameters:
        - name: workspaceKey
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
      responses:
        "200":
          description: Tenant admin staff workspace access granted
          content: { application/json: { schema: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceAccess" } } }
        "403": { description: Tenant admin staff account is not assigned to this workspace }
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - username
        - password
    AuthenticatedLocalUser:
      type: object
      properties:
        accountId:
          type: string
        tenantId:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - tenant_admin
            - module_admin
            - module_staff
            - client
            - tenant_admin_staff
        moduleKey:
          oneOf:
            - $ref: "#/components/schemas/ModuleKey"
            - type: "null"
        workspaceKeys:
          type: array
          items:
            $ref: "#/components/schemas/AuthenticatedWorkspaceKey"
        requiresPasswordChange:
          type: boolean
      required:
        - accountId
        - tenantId
        - username
        - role
        - moduleKey
        - workspaceKeys
        - requiresPasswordChange
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 255
        newPassword:
          type: string
          minLength: 8
          maxLength: 255
      required:
        - currentPassword
        - newPassword
    PasswordChangeResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - password_changed
        requiresPasswordChange:
          type: boolean
          enum:
            - false
      required:
        - status
        - requiresPasswordChange
    AuthLogoutResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    CustomerContext:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
        subdomain:
          type: string
      required:
        - customerName
        - subdomain
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ModuleKey:
      type: string
      enum:
        - module_a
        - module_b
        - module_c
        - module_d
        - module_e
        - module_f
        - module_g
        - module_h
    WorkspaceKey:
      type: string
      pattern: "^ws-[1-9][0-9]*$"
    TenantAdminStaffWorkspaceKey:
      type: string
      pattern: "^tasw-[1-9][0-9]*$"
    TenantAdminStaffCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, temporaryPassword, workspaceKeys]
      properties:
        username: { type: string }
        displayName: { type: string }
        temporaryPassword: { type: string, minLength: 8 }
        workspaceKeys: { type: array, minItems: 1, items: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" } }
    TenantAdminStaffWorkspaceCreateRequest:
      $ref: "#/components/schemas/WorkspaceMetadataRequest"
    TenantAdminStaffStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: { type: boolean }
    TenantAdminStaffAssignmentsRequest:
      type: object
      additionalProperties: false
      required: [workspaceKeys]
      properties:
        workspaceKeys: { type: array, minItems: 1, items: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" } }
    TenantAdminStaffPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, minLength: 8 }
    TenantAdminStaffWorkspaceUpdateRequest:
      $ref: "#/components/schemas/WorkspaceMetadataRequest"
    AuthenticatedWorkspaceKey:
      oneOf:
        - $ref: "#/components/schemas/WorkspaceKey"
        - $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey"
    TenantAdminStaffWorkspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceKey: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
        displayName: { type: string }
        workspaceType: { $ref: "#/components/schemas/WorkspaceType" }
        isActive: { type: boolean }
        publicVisible: { type: boolean }
        contactEnabled: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        contentNodes: { type: array, items: { $ref: "#/components/schemas/WorkspaceContentNode" } }
      required: [id, workspaceKey, displayName, workspaceType, isActive, publicVisible, contactEnabled, sortOrder, createdAt, contentNodes]
    TenantAdminStaffWorkspaceList:
      type: object
      properties:
        workspaces: { type: array, items: { $ref: "#/components/schemas/TenantAdminStaffWorkspace" } }
      required: [workspaces]
    TenantAdminStaffAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        requiresPasswordChange: { type: boolean }
        createdAt: { type: string, format: date-time }
        workspaceKeys:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
      required: [id, username, displayName, isActive, requiresPasswordChange, createdAt, workspaceKeys]
    StaffAccountDeletionResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        deleted: { type: boolean, enum: [true] }
      required: [accountId, deleted]
    TenantAdminStaffAdministrationSnapshot:
      type: object
      properties:
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminStaffWorkspace" }
        staff:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminStaffAccount" }
      required: [workspaces, staff]
    TenantAdminStaffAssignmentsResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        workspaceKeys:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
      required: [accountId, workspaceKeys]
    TenantAdminStaffStatusResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        active: { type: boolean }
      required: [accountId, active]
    TenantAdminStaffPasswordResetResponse:
      type: object
      properties:
        status: { type: string, enum: [password_reset] }
        accountId: { type: string, format: uuid }
      required: [status, accountId]
    TenantAdminStaffWorkspaceRemovalResponse:
      type: object
      properties:
        workspaceKey: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
        removed: { type: boolean, enum: [true] }
      required: [workspaceKey, removed]
    TenantAdminStaffWorkspaceAccess:
      type: object
      properties:
        allowed: { type: boolean, enum: [true] }
        workspaceKey: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
        workspaceKeys:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminStaffWorkspaceKey" }
      required: [allowed, workspaceKey, workspaceKeys]
    RouteAccess:
      type: object
      properties:
        allowed:
          type: boolean
        tenantId:
          type: string
        customerName:
          type: string
        subdomain:
          type: string
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        workspaceKey:
          $ref: "#/components/schemas/WorkspaceKey"
      required:
        - allowed
        - tenantId
        - customerName
        - subdomain
        - moduleKey
        - workspaceKey
    ManagedTenantAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - module_admin
            - module_staff
            - client
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        workspaceKeys:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceKey"
        isActive:
          type: boolean
        requiresPasswordChange:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - displayName
        - role
        - moduleKey
        - workspaceKeys
        - isActive
        - requiresPasswordChange
        - createdAt
    TenantAdminCurrentUser:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
            - tenant_admin
            - module_admin
        moduleKey:
          oneOf:
            - $ref: "#/components/schemas/ModuleKey"
            - type: "null"
      required:
        - accountId
        - username
        - role
        - moduleKey
    TenantAdminSnapshot:
      type: object
      properties:
        tenantId:
          type: string
        subdomain:
          type: string
        customerName:
          type: string
        enabledModules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleKey"
        currentUser:
          $ref: "#/components/schemas/TenantAdminCurrentUser"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/ManagedWorkspaceOption"
        users:
          type: array
          items:
            $ref: "#/components/schemas/ManagedTenantAccount"
      required:
        - tenantId
        - subdomain
        - customerName
        - enabledModules
        - currentUser
        - workspaces
        - users
    ManagedWorkspaceOption:
      type: object
      properties:
        moduleKey:
          $ref: "#/components/schemas/ModuleKey"
        workspaceKey:
          $ref: "#/components/schemas/WorkspaceKey"
        displayName:
          type: string
      required:
        - moduleKey
        - workspaceKey
        - displayName
    ManagedTenantAccountCreateRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          minLength: 1
